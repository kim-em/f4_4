name = "f4-paper"
version = "0.1.0"
defaultTargets = ["paper"]

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "a40afc8c44badcc1e58f060ec70a2aa5cb6243c6"

# The genre and the TeX renderer: no paper-specific content.
[[lean_lib]]
name = "VersoPaper"

# The paper: its notation roles, configuration, references and text.
[[lean_lib]]
name = "Paper"

[[lean_exe]]
name = "paper"
root = "Main"
